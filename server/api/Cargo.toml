[package]
name = "habit-api"
version = "0.1.0"
description = "Habit tracker sync server"
edition.workspace = true
license.workspace = true

[dependencies]
habit-core = { path = "../core" }
aes-gcm = "0.10"
argon2 = { version = "0.5", features = ["std"] }
axum = "0.8"
base64 = "0.22"
chrono.workspace = true
chrono-tz.workspace = true
hkdf = "0.12"
hmac = "0.12"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls", "rustls-native-certs", "ring", "hostname"] }
p256 = { version = "0.13", features = ["ecdh", "ecdsa"] }
rand = "0.9"
rand_core = { version = "0.6", features = ["getrandom"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "json"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
url = "2"
tower-http = { version = "0.6", features = ["cors", "trace", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v7"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
